<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Metallic blue gradient -->
  <defs>
    <linearGradient id="metallic-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B5B9B"/>
      <stop offset="50%" style="stop-color:#4A90E2"/>
      <stop offset="100%" style="stop-color:#2B5B9B"/>
    </linearGradient>
  </defs>

  <!-- Hexagon with Circuit - Centered in viewport -->
