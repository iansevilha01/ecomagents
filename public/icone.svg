    <path d="M25 5 L45 15 L45 35 L25 45 L5 35 L5 15 Z" fill="url(#metallic-blue)"/>
    <path d="M15 25 L35 25 M25 15 L25 35" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>
    <circle cx="25" cy="25" r="3" fill="#FFFFFF"/>
    <circle cx="15" cy="15" r="2" fill="#FFFFFF"/>
    <circle cx="35" cy="35" r="2" fill="#FFFFFF"/>
  </g>
</svg>
